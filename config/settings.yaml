app:
  name: BuyWiseAI
  version: "0.2.1"
  default_country: Pakistan
  default_currency: PKR
  cache_ttl_seconds: 1800

llm:
  model: openai/gpt-oss-120b
  temperature: 0.2
  max_tokens: 1200

search:
  max_results_per_provider: 20
  request_timeout_seconds: 15
  max_retries: 2
  max_rounds: 3
  target_results: 10
  min_distinct_sources: 8
  max_results_per_source: 2
  providers:
    - serper
    - serpapi
    - tavily
    - brave
    - duckduckgo
    - marketplace_targeted

marketplaces:
  - amazon
  - ebay
  - walmart
  - aliexpress
  - daraz
  - bestbuy
  - target
  - newegg
  - flipkart

  # Explicitly targeted in Stage 2
  priority:
    - daraz
    - aliexpress

logging:
  level: INFO
